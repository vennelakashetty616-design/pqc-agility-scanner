name: crypto-agility

on:
  push:
  pull_request:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner and tests
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest
      - name: Flag new confirmed cryptographic fingerprints
        run: pqcscan ci --path samples/legacy-billing --baseline baselines/legacy-billing.json
