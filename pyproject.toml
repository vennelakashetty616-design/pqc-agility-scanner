[project]
name = "pqc-agility-scanner"
version = "0.1.0"
description = "Inventory cryptographic dependencies and draft a post-quantum migration plan. A scan does not prove quantum safety."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
pqcscan = "pqcscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
